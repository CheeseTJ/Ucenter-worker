name: Deploy

# push 到 master 自动 wrangler deploy。
# schema.sql 是幂等的（CREATE TABLE IF NOT EXISTS），每次部署顺带执行一次。
#
# 凭据：部署用的 Cloudflare API Token 存在仓库 secret「CLOUDFLARE_API_TOKEN」，
# 在 Cloudflare 控制台 My Profile → API Tokens 创建，值只在创建时显示一次。
# 只需这两项权限，且未配 IP 白名单，因此可以直接跑在 GitHub 托管 runner 上：
#   Account → Workers Scripts : Edit    （wrangler deploy）
#   Account → D1 : Edit                 （wrangler d1 execute --remote）
# 换 token 时记得同步更新这个 secret，否则 Deploy 步骤会报
# "In a non-interactive environment, it's necessary to set a CLOUDFLARE_API_TOKEN".
on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'schema.sql'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler 4 要求 Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Inject D1 database id
        # wrangler.jsonc 里是占位符（仓库公开，不写真实 ID），这里从 secret 替换
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -e
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "缺少 D1_DATABASE_ID secret，无法确定 D1 库"
            exit 1
          fi
          sed -i "s|__D1_DATABASE_ID__|${D1_DATABASE_ID}|" wrangler.jsonc
          if grep -q '__D1_DATABASE_ID__' wrangler.jsonc; then
            echo "占位符未被替换，检查 wrangler.jsonc"
            exit 1
          fi

      - name: Deploy
        env:
          # 账号 ID 由 secret 注入（wrangler.jsonc 里是占位符，仓库公开）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute user-center-db --remote --file=./schema.sql
